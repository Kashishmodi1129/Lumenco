<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Lumenco</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <button class="back-btn" onclick="navigateTo('index.html')">← Home</button>
            <h1>Student Login</h1>
        </header>

        <main class="main-content login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-icon">👨‍🎓</div>
                    <h2>Student Login</h2>
                    <p>Enter your credentials to access learning materials</p>
                </div>

                <form id="studentLoginForm" class="login-form">
                    <div class="form-group">
                        <label for="studentId">Student ID</label>
                        <input type="text" id="studentId" placeholder="Enter your student ID" required>
                    </div>

                    <div class="form-group">
                        <label for="studentPassword">Password</label>
                        <input type="password" id="studentPassword" placeholder="Enter your password" required>
                    </div>

                    <div class="form-options">
                        <label class="checkbox">
                            <input type="checkbox" id="rememberStudent">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        Login to Student Portal
                    </button>

                    <div class="login-divider">
                        <span>OR</span>
                    </div>

                    <button type="button" class="btn btn-outline btn-block" onclick="navigateTo('student-login.html')">
                        Continue Without Login (Guest Mode)
                    </button>

                    <div class="login-note">
                        <span class="note-icon">ℹ️</span>
                        Guest mode provides limited access. Login for full features.
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
